name: Release

# Creates the GitHub Release "v<version>" (version = version.json) and attaches
#   MoaPlayer-Setup-<ver>.exe (+ .blockmap, latest.yml = the Windows auto-update feed)
#   MoaPlayer-<ver>.apk
#
# Triggers
#   • push to main  → releases automatically when v<version> has no complete release yet
#                     (bump version.json, push, done — no tag needed). A failed build is retried on
#                     the next push to main because the release is still incomplete; only the missing
#                     platform is rebuilt. The APK is only built and attached when the signing secrets exist
#                     (a debug-signed APK could never be updated by later release-signed ones); add the
#                     secrets (RELEASING.md) and push / run the workflow again to add it.
#   • push a v* tag → same, for that tag (the tag must match version.json)
#   • manual run    → Actions → Release → Run workflow (force: rebuild even if complete)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild and re-upload even if the release already has every file'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
      win: ${{ steps.check.outputs.win }}
      android: ${{ steps.check.outputs.android }}
      nokey: ${{ steps.check.outputs.nokey }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version and tag
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./version.json').version")
          TAG="v${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$TAG" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version.json (${VERSION}). Update version.json, commit, then tag again."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION → $TAG"

      # Earlier versions of this workflow attached debug-signed APKs (marker *.apk.debug-key.txt).
      # Those can't be updated in place by release-signed builds, so take them down everywhere.
      - name: Remove debug-signed APKs from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            -q '.[] | .tag_name as $t | .assets[] | select(.name | endswith(".apk.debug-key.txt")) | "\($t) \(.name)"' > debug-apks.txt || true
          while read -r T MARKER; do
            [ -n "$T" ] || continue
            APK="${MARKER%.debug-key.txt}"
            echo "::warning::$T: removing debug-signed $APK"
            gh release delete-asset "$T" "$APK" --repo "$GITHUB_REPOSITORY" -y || true
            gh release delete-asset "$T" "$MARKER" --repo "$GITHUB_REPOSITORY" -y || true
          done < debug-apks.txt

      - name: Is a (complete) release already there?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          FORCE: ${{ inputs.force || false }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'yes' || '' }}
        run: |
          set -uo pipefail
          WIN=true; AND=true
          if [ "$FORCE" != "true" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > assets.txt 2>/dev/null; then
            if grep -qx "MoaPlayer-Setup-${VERSION}.exe" assets.txt && grep -qx "latest.yml" assets.txt; then WIN=false; fi
            if grep -qx "MoaPlayer-${VERSION}.apk" assets.txt; then AND=false; fi
          fi
          NOKEY=false
          if [ "$AND" = "true" ] && [ -z "$HAS_KEY" ]; then
            AND=false; NOKEY=true
            echo "::warning::Android signing secrets (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD) are not set — the APK is not built. Add them (RELEASING.md), then push again or run this workflow."
          fi
          BUILD=false; if [ "$WIN" = "true" ] || [ "$AND" = "true" ]; then BUILD=true; fi
          { echo "build=$BUILD"; echo "win=$WIN"; echo "android=$AND"; echo "nokey=$NOKEY"; } >> "$GITHUB_OUTPUT"
          if [ "$BUILD" = "true" ]; then echo "Building $TAG (windows=$WIN android=$AND)"; else echo "$TAG is already released with every file — nothing to do (bump version.json to release again)"; fi

      - name: Point the tag at this commit
        if: steps.check.outputs.build == 'true' && github.ref_type != 'tag'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$TAG" -m "MoaPlayer $TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

  create-release:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Release notes
        id: notes
        run: |
          set -euo pipefail
          NOTES=$(node -p "try { require('./release.json').notes || '' } catch (e) { '' }")
          V="${{ needs.prepare.outputs.version }}"
          {
            echo "body<<__EOF__"
            if [ -n "$NOTES" ]; then echo "$NOTES"; echo; fi
            echo "### 다운로드"
            echo "- **Windows**: \`MoaPlayer-Setup-${V}.exe\` — 내려받아 실행하면 설치됩니다. 설치 후에는 자동으로 업데이트됩니다."
            echo "- **Android**: \`MoaPlayer-${V}.apk\` — 휴대폰에서 내려받아 설치하세요. 1.4.0부터는 앱이 새 버전을 직접 내려받아 설치합니다."
            echo
            echo "_Windows에서 \"Windows의 PC 보호\" 창이 뜨면 **추가 정보 → 실행**을 누르세요 (코드 서명 인증서가 없는 프로그램이라 처음 한 번 표시됩니다)._"
            echo
            echo "_빌드 파일은 워크플로가 끝나면 아래에 추가됩니다._"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create (or update) the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: 모아 플레이어 v${{ needs.prepare.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: [prepare, create-release]
    if: needs.prepare.outputs.win == 'true'
    uses: ./.github/workflows/build-windows.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write

  android:
    needs: [prepare, create-release]
    if: needs.prepare.outputs.android == 'true'
    uses: ./.github/workflows/build-android.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write

  summary:
    needs: [prepare, create-release, windows, android]
    if: always() && needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "### 모아 플레이어 ${{ needs.prepare.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Windows: ${{ needs.windows.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android: ${{ needs.android.result }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.prepare.outputs.nokey }}" = "true" ]; then
            echo "  - APK not built: add the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets (RELEASING.md), then run Release again" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

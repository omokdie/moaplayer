name: Build Android APK

# Builds android/ → MoaPlayer-<ver>.apk and, when called from release.yml with a tag, attaches it to
# that GitHub Release (where the app's update check looks).
# Signing: secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD (optional ANDROID_KEY_ALIAS,
# default "moa"; ANDROID_KEY_PASSWORD, default = keystore password).  Without them the APK is signed
# with a debug key and only kept as a workflow artifact — it is never attached to a release, because a
# debug-signed install could not be updated by the release-signed APKs that follow.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to attach the files to (empty = artifacts only)'
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # NDK + CMake: the FFmpeg audio decoder (E-AC3/AC3, DTS, TrueHD, ALAC) and its JNI wrapper
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false

      # FFmpeg for the fallback audio decoder: our small build (android/scripts/build-ffmpeg-android.sh),
      # static libraries for arm64-v8a + armeabi-v7a, cached by script hash and NDK version.
      - name: Cache FFmpeg for Android
        id: ffcache
        uses: actions/cache@v5
        with:
          path: android/ffmpeg-android
          key: ffmpeg-android-${{ hashFiles('android/scripts/build-ffmpeg-android.sh') }}-ndk27.2.12479018

      - name: Build FFmpeg for Android
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: WORK="$RUNNER_TEMP/ffwork-android" bash android/scripts/build-ffmpeg-android.sh "$ANDROID_HOME/ndk/27.2.12479018" android/ffmpeg-android

      - name: Check FFmpeg libraries
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a; do
            for lib in avcodec swresample avutil; do
              test -f "android/ffmpeg-android/$abi/lib/lib$lib.a" || { echo "::error::lib$lib.a missing for $abi"; exit 1; }
            done
          done
          cat android/ffmpeg-android/README.txt
          du -sh android/ffmpeg-android/*

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./version.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Prepare release keystore
        id: keystore
        run: |
          set -uo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            # tolerate spaces / line breaks picked up while copy-pasting the secrets
            if ! printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d ' \r\n\t' | base64 -d > "${RUNNER_TEMP}/release.keystore" 2>/dev/null; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 — paste the whole (very long) line again."; exit 1
            fi
            PW=$(printf '%s' "${ANDROID_KEYSTORE_PASSWORD}" | tr -d ' \r\n\t')
            KPW=$(printf '%s' "${ANDROID_KEY_PASSWORD:-$PW}" | tr -d ' \r\n\t')
            ALIAS="${ANDROID_KEY_ALIAS:-moa}"
            if [ -z "$PW" ]; then echo "::error::ANDROID_KEYSTORE_PASSWORD secret is empty or missing."; exit 1; fi
            if ! keytool -list -keystore "${RUNNER_TEMP}/release.keystore" -storepass "$PW" -alias "$ALIAS" >/dev/null 2>&1; then
              echo "::error::The keystore cannot be opened with ANDROID_KEYSTORE_PASSWORD (alias '$ALIAS'). Check both secrets."; exit 1
            fi
            {
              echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore"
              echo "KEYSTORE_PASSWORD=$PW"
              echo "KEY_ALIAS=$ALIAS"
              echo "KEY_PASSWORD=$KPW"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore: provided and verified"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [ -n "${VAR_KEYSTORE}" ] || [ -n "${VAR_PASSWORD}" ]; then
              echo "::warning::The signing key was saved as an Actions VARIABLE, not a SECRET, so it is not used. Settings → Secrets and variables → Actions → 'Secrets' tab → New repository secret (then delete the variables)."
            fi
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set — the APK will be signed with a DEBUG key. Add the secrets described in RELEASING.md for a distributable build."
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VAR_KEYSTORE: ${{ vars.ANDROID_KEYSTORE_BASE64 != '' && 'yes' || '' }}
          VAR_PASSWORD: ${{ vars.ANDROID_KEYSTORE_PASSWORD != '' && 'yes' || '' }}

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p out
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)
          test -n "$APK" || { echo "::error::no APK produced"; exit 1; }
          cp "$APK" "out/MoaPlayer-${VERSION}.apk"
          # the FFmpeg audio decoder must be inside, for both phone ABIs
          unzip -l "out/MoaPlayer-${VERSION}.apk" > apk-files.txt
          grep "lib/" apk-files.txt || true
          for abi in arm64-v8a armeabi-v7a; do
            grep -q "lib/$abi/libffmpegJNI.so" apk-files.txt \
              || { echo "::error::lib/$abi/libffmpegJNI.so is missing from the APK"; exit 1; }
          done
          # ...and loadable: JNI_OnLoad exported, no text relocations (refused since Android 6),
          # only system libraries needed, 16 KB page alignment on arm64 (newer 64-bit devices)
          NB="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          rm -rf apk-lib && mkdir apk-lib && unzip -q -o "out/MoaPlayer-${VERSION}.apk" 'lib/*' -d apk-lib
          for abi in arm64-v8a armeabi-v7a; do
            SO="apk-lib/lib/$abi/libffmpegJNI.so"
            "$NB/llvm-nm" -D --defined-only "$SO" > syms.txt
            "$NB/llvm-readelf" -dW "$SO" > dyn.txt
            echo "$abi: $(grep -c . syms.txt) exported symbols, needs: $(grep NEEDED dyn.txt | sed 's/.*\[\(.*\)\]/\1/' | tr '\n' ' ')"
            grep -q " T JNI_OnLoad$" syms.txt || { echo "::error::JNI_OnLoad not exported ($abi)"; exit 1; }
            if grep -q TEXTREL dyn.txt; then echo "::error::text relocations in $abi library"; exit 1; fi
            if grep NEEDED dyn.txt | grep -v -E "\[(libandroid|liblog|libm|libdl|libc)\.so\]"; then
              echo "::error::unexpected library dependency ($abi)"; exit 1
            fi
          done
          "$NB/llvm-readelf" -lW apk-lib/lib/arm64-v8a/libffmpegJNI.so | awk '$1 == "LOAD" { print $NF }' > align.txt
          cat align.txt
          if grep -v -x "0x4000" align.txt; then echo "::error::arm64 library is not 16 KB aligned"; exit 1; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/aapt2" dump badging "out/MoaPlayer-${VERSION}.apk" > badging.txt || true
          head -n 3 badging.txt || true
          "$BT/apksigner" verify --print-certs "out/MoaPlayer-${VERSION}.apk" | grep -E "SHA-256|DN" || true
          ls -la out
          echo "path=out/MoaPlayer-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: MoaPlayer-android
          path: out/*.apk
          if-no-files-found: error

      - name: Debug-signed APK stays out of the release
        if: (inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')) && steps.keystore.outputs.signed != 'true'
        run: echo "::warning::The APK is signed with a debug key, so it is only kept as a workflow artifact and not attached to the release. Add the signing secrets (RELEASING.md)."

      - name: Attach APK to the GitHub Release
        if: (inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')) && steps.keystore.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          files: out/MoaPlayer-${{ steps.meta.outputs.version }}.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

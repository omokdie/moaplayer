name: Build Windows installer

# Builds pc/dist/MoaPlayer-Setup-<ver>.exe (+ latest.yml) with FFmpeg inside.
# FFmpeg is our own small build (pc/scripts/build-ffmpeg.sh, cross-compiled on Ubuntu, cached by script hash).
# Called from release.yml with a tag, the files are attached to that GitHub Release, which is the
# electron-updater feed of installed copies.  Manual runs only produce workflow artifacts.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to attach the files to (empty = artifacts only)'
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cached FFmpeg build
        id: cache
        uses: actions/cache@v5
        with:
          path: ffmpeg-win64
          key: ffmpeg-win64-${{ hashFiles('pc/scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg for Windows (mingw-w64)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mingw-w64 nasm pkg-config meson ninja-build
          TARGET=win64 WORK="$RUNNER_TEMP/ffwork" bash pc/scripts/build-ffmpeg.sh "$GITHUB_WORKSPACE/ffmpeg-win64"

      - name: Size
        run: du -sh ffmpeg-win64 && ls -la ffmpeg-win64

      - uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-win64
          path: ffmpeg-win64
          if-no-files-found: error
          retention-days: 3

  windows:
    needs: ffmpeg
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: pc
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: FFmpeg (SW decoder, thumbnails, embedded subtitles)
        uses: actions/download-artifact@v6
        with:
          name: ffmpeg-win64
          path: pc/ffmpeg

      - name: Check FFmpeg runs on Windows
        shell: pwsh
        working-directory: pc
        run: |
          foreach ($tool in 'ffmpeg.exe', 'ffprobe.exe') {
            $out = & ".\ffmpeg\$tool" -hide_banner -version
            if ($LASTEXITCODE -ne 0) { throw "$tool does not run (exit $LASTEXITCODE)" }
            Write-Host ($out | Select-Object -First 1)
          }
          $enc = & .\ffmpeg\ffmpeg.exe -hide_banner -encoders
          if (-not ($enc -match 'libx264')) { throw 'libx264 encoder missing' }
          $dec = & .\ffmpeg\ffmpeg.exe -hide_banner -decoders
          foreach ($d in 'h264', 'hevc', 'mpeg4', 'ac3', 'dca', 'libdav1d', 'pgssub', 'wmv3', 'rv40') {
            if (-not ($dec -match " $d ")) { throw "decoder $d missing" }
          }
          Write-Host ("FFmpeg: {0:N1} MB" -f ((Get-ChildItem ffmpeg | Measure-Object Length -Sum).Sum / 1MB))

      - name: Sync version from version.json
        run: npm run sync-version

      - name: Code-signing certificate (optional secrets CSC_LINK / CSC_KEY_PASSWORD)
        run: |
          if [ -n "${CSC_LINK_SECRET}" ]; then
            echo "CSC_LINK=${CSC_LINK_SECRET}" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${CSC_KEY_PASSWORD_SECRET}" >> "$GITHUB_ENV"
            echo "Code signing: enabled"
          else
            echo "Code signing: not configured (unsigned exe → SmartScreen warning on first run)"
          fi
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}

      # electron-builder writes latest.yml because build.publish is configured; the upload
      # itself is done with action-gh-release below so re-runs are idempotent.
      - name: Build installer
        run: npm run dist:win

      - name: Check the packaged app
        run: |
          set -euo pipefail
          ls -la dist
          R=dist/win-unpacked/resources
          test -f "$R/app.asar" || { echo "::error::app.asar missing"; exit 1; }
          test -f "$R/app-update.yml" || { echo "::error::app-update.yml missing (auto-update would not work)"; exit 1; }
          test -f "$R/ffmpeg/ffmpeg.exe" && test -f "$R/ffmpeg/ffprobe.exe" || { echo "::error::FFmpeg missing in resources/ffmpeg"; exit 1; }
          cat "$R/app-update.yml"
          "$R/ffmpeg/ffprobe.exe" -hide_banner -version > ffprobe-version.txt
          head -n 1 ffprobe-version.txt
          du -sh dist/win-unpacked "$R/ffmpeg" dist/*.exe
          ls dist/win-unpacked/locales
          test ! -f dist/win-unpacked/dxcompiler.dll || { echo "::error::dxcompiler.dll should have been removed by after-pack"; exit 1; }

      - uses: actions/upload-artifact@v6
        with:
          name: MoaPlayer-windows
          path: |
            pc/dist/*.exe
            pc/dist/*.blockmap
            pc/dist/latest.yml
          if-no-files-found: error

      - name: Attach installer + update feed to the GitHub Release
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          files: |
            pc/dist/MoaPlayer-Setup-*.exe
            pc/dist/latest.yml
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
